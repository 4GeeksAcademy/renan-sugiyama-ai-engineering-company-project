services:
  telemetry-postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TELEMETRY_POSTGRES_PASSWORD:?Set TELEMETRY_POSTGRES_PASSWORD in .env.telemetry}
      TELEMETRY_OWNER_PASSWORD: ${TELEMETRY_OWNER_PASSWORD:?Set TELEMETRY_OWNER_PASSWORD in .env.telemetry}
      TELEMETRY_INGEST_PASSWORD: ${TELEMETRY_INGEST_PASSWORD:?Set TELEMETRY_INGEST_PASSWORD in .env.telemetry}
    volumes:
      - telemetry_postgres_data:/var/lib/postgresql/data
      - ./services/telemetry-api/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexova-network

  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    command: ["sh", "./start.sh"]
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - type: bind
        source: ./uis
        target: /app/uis
      - website_node_modules:/app/uis/website/node_modules
      - dashboard_node_modules:/app/uis/backoffice/dashboard/node_modules
    environment:
      DASHBOARD_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - nexova-network

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8002:8000"
    volumes:
      - type: bind
        source: ./services/dashboard-aggregator-api
        target: /app
    networks:
      - nexova-network

volumes:
  telemetry_postgres_data:
  website_node_modules:
  dashboard_node_modules:

networks:
  nexova-network:
    name: nexova-network
    driver: bridge
